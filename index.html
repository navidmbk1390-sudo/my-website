<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>سایتNavid(MBK)</title>

    <style>

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #16a34a, #0b0b0b);
            color: #222;
            text-align: center;
        }

        header {
            background: #22c55e;
            color: white;
            padding: 25px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
        }

        header h2 {
            margin: 0;
            font-size: 28px;
        }

        .main {
            padding: 70px 20px;
        }

        h1 {
            font-size: 45px;
            color: white;
            margin-bottom: 15px;
            text-shadow: 0 0 15px #22c55e;
        }

        p {
            font-size: 20px;
            color: white;
        }

        .button {
            display: inline-block;
            margin-top: 25px;
            padding: 15px 30px;
            background: #ffe600;
            color: #000;
            text-decoration: none;
            font-size: 18px;
            font-weight: bold;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(34,197,94,0.3);
            transition: 0.2s;
        }

        .button:hover {
            background: #16a34a;
            color: white;
            transform: translateY(-3px);
        }

        .card {
            max-width: 500px;
            margin: 40px auto;
            padding: 30px;
            background: white;
            border-radius: 15px;
            box-shadow: 0 5px 25px rgba(0,0,0,0.3);
            border: 2px solid #22c55e;
        }

        .card img {
            width: 100%;
            max-width: 450px;
            border-radius: 12px;
            border: 3px solid #22c55e;
        }

        .card h2 {
            color: #16a34a;
        }

        .card h3 {
            color: #16a34a;
            font-size: 24px;
        }

        .card p {
            color: #555;
        }

        .download {
            display: inline-block;
            margin: 10px 5px;
            padding: 13px 22px;
            background: #16a34a;
            color: white;
            text-decoration: none;
            font-weight: bold;
            border-radius: 10px;
            transition: 0.2s;
        }

        .download:hover {
            background: #22c55e;
            transform: scale(1.05);
        }

        footer {
            margin-top: 50px;
            padding: 25px;
            background: linear-gradient(
                90deg,
                #ff0000,
                #000000
            );
            color: white;
            font-weight: bold;
        }

    </style>

</head>

<body>

    <header>

        <h2>
            🎮 سایت گیمینگ MBK
        </h2>

    </header>


    <div class="main">

        <h1>
            چطوری خوشتیپ! 🔥
        </h1>

        <p>
            خوش اومدی به سایت Navid(mbk) 😎
        </p>


        <a href="#pack" class="button">
            📦 Resource Pack ها
        </a>


        <div class="card" id="pack">

            <!-- عکس Resource Pack -->

            <img src="pack1.jpg" alt="Resource Pack 1">


            <h3>
                🔥 Resource Pack شماره 1
            </h3>


            <p>
                Resource Pack خفن برای Minecraft Java.
            </p>


            <!-- دانلود عکس -->

            <a href="pack1.jpg" download class="download">
                🖼️ دانلود عکس
            </a>


            <!-- دانلود فایل Resource Pack -->

            <a href="pack1.zip" download class="download">
                ⬇️ دانلود Resource Pack
            </a>


            <h2>
                🎮 Minecraft Java
            </h2>


            <p>
                اینجا قراره Resource Pack های
                خفن Minecraft Java رو قرار بدم.
            </p>

        </div>

    </div>


    <footer>

        BedWars Resource Pack

    </footer>

</body>

</html>
